name: Verify and package Windows
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.12.0'
          cache: npm
      - name: Install Rust stable
        run: rustup update stable --no-self-update
      - run: npm ci
      - run: npm run format:check
      - run: npm run build
      - run: npm run notices
      - run: npm test
      - run: npx playwright install chromium
      - run: npm run test:ui
      - name: Check Windows script syntax
        shell: powershell
        run: ./scripts/check-windows-scripts.ps1
      - name: Task activity safety checks
        shell: powershell
        run: ./scripts/test-windows-activity.ps1
      - name: Native tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Build Windows artifacts
        run: npm run package:windows
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-x64
          path: artifacts/
          if-no-files-found: error
      - name: Upload failing UI traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-failure-traces
          path: test-results/
          if-no-files-found: ignore
